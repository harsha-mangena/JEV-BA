schema_version: 1
id: checkout_rejects_empty_address
requirement_ids: [CHECKOUT-03]
mode: regression
critical: true
start_path: /cart
fixture: customer_cart_one_item_v1
role: customer
goal: Submitting checkout without a delivery address is rejected and creates no order.
milestones:
  - id: rejected_without_mutation
    steps:
      - op: click
        target: { role: button, name: Place order }
        intent: checkout.submit
    assertions:
      - type: ui_visible
        target: address-error
      - type: ui_text
        target: address-error
        equals: Delivery address is required.
      - type: order_count_delta
        customer_ref: fixture.customer_id
        equals: 0
      - type: ui_visible
        target: { role: button, name: Place order }
execution_profiles: [chromium_desktop]
policy:
  environments: [local, preview, staging]
  mutations: [test_owned_order_create]
  external_effects: sandbox_only
  allowed_origin_profile: owned_checkout
cleanup: delete_test_owned_entities
