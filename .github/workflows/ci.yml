name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://qa@localhost:5432/qa
      QA_REQUIRE_SERVICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Allow unprivileged user namespaces (generated-code sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm run lane -- static
      - run: npm run lane -- unit
      - run: npm run qa -- validate
      - run: npm run lane -- e2e
      - run: npm run lane -- service
      - run: npm run lane -- audit
      - run: npm run lane -- isolation
      - name: Upload lane manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-manifests
          path: evidence/lanes/*.json
